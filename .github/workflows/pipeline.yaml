name: Build e Deploy Docker II

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/torta-de-morango:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Implantar na VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e

            docker pull stelasm/torta-de-morango:latest

            docker rm -f torta-de-morango 2>/dev/null || true

            docker run -d \
              --name torta-de-morango \
              -p 80:80 \
              --restart unless-stopped \
              stelasm/torta-de-morango:latest

            docker ps --filter "name=torta-de-morango"
            docker logs --tail 30 torta-de-morango
