name: Build e Deploy Docker II

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app-docker-aula:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Implantar na VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            whoami
            docker --version
            docker ps -a
            docker pull ${{ secrets.DOCKER_USERNAME }}/app-docker-aula:latest
            docker run -d --name app-docker-aula -p 80:80 --restart unless-stopped stela-sm/app-docker-aula:latest
            docker inspect app-docker-aula --format '{{.Config.Image}}'
